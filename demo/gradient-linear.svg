<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!--
    Horizontal gradient: fully opaque blue on the left, fading to fully
    transparent on the right. The alpha channel runs linearly from 1.0 to 0.0,
    so the Alpha Mask Events threshold slider sweeps the clickable boundary
    smoothly across the image.
  -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007bff" stop-opacity="1" />
      <stop offset="1" stop-color="#007bff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#fade)" />
</svg>
